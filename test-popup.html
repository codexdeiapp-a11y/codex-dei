<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test Popup</title>
<style>
.popup-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:300;display:none;align-items:center;justify-content:center;}
.popup-bg.open{display:flex;}
.popup{background:#1a1208;border:1px solid gold;padding:32px;max-width:400px;text-align:center;color:gold;}
</style>
</head>
<body style="background:#0c0a07;color:gold;font-family:serif;padding:40px;text-align:center;">
<h1>Test Popup</h1>
<button onclick="openPop()" style="padding:14px 28px;background:gold;border:none;font-size:1rem;cursor:pointer;margin:20px">
  Cliquez pour tester le popup
</button>

<div class="popup-bg" id="myPopup">
  <div class="popup">
    <h2>🙏 Le popup fonctionne !</h2>
    <p style="margin:16px 0">Soutenez le Codex Dei</p>
    <a href="https://paypal.me/cadexdi/5" target="_blank" 
       style="display:block;background:linear-gradient(135deg,#003087,#009cde);color:white;padding:12px;text-decoration:none;margin-bottom:10px">
      Faire un don 5 CHF
    </a>
    <button onclick="closePop()" style="background:transparent;border:none;color:gold;cursor:pointer;text-decoration:underline">
      Continuer sans donner
    </button>
  </div>
</div>

<script>
function openPop() {
  document.getElementById('myPopup').classList.add('open');
}
function closePop() {
  document.getElementById('myPopup').classList.remove('open');
}
document.getElementById('myPopup').addEventListener('click', function(e) {
  if(e.target === this) closePop();
});
</script>
</body>
</html>
